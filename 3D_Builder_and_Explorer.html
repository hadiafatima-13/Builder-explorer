<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Builder & Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg1:#082f49;--bg2:#0c4a6e;--card:#fff;--ink:#1e1b2e;--accent:#0ea5e9;--good:#16a34a;--bad:#dc2626;--muted:#6b7280;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#1f2937;--ink:#f3f4f6;--muted:#9ca3af;}}
:root[data-theme="dark"]{--card:#1f2937;--ink:#f3f4f6;--muted:#9ca3af;}
*{box-sizing:border-box;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;padding-left:12px;padding-right:12px;}
.wrap{width:100%;max-width:680px;padding:20px 0 40px;position:relative;z-index:1;}
h1{color:#fff;text-align:center;margin-bottom:2px;}
.sub{color:#bae6fd;text-align:center;margin-bottom:14px;font-size:.9rem;}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.tab{padding:8px 16px;border-radius:20px;border:2px solid #fff3;background:transparent;color:#fff;font-weight:700;cursor:pointer;}
.tab.active{background:var(--accent);border-color:var(--accent);}
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.stats{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px;font-size:.9rem;}
#stage{width:100%;height:220px;border-radius:12px;background:#e0f2fe;cursor:grab;touch-action:none;}
.shapename{text-align:center;font-weight:700;margin:8px 0 4px;}
.q{font-weight:600;margin:8px 0;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
button.opt{padding:12px;border-radius:10px;border:2px solid #d1d5db;background:transparent;color:var(--ink);cursor:pointer;font-size:1rem;}
button.opt.correct{background:var(--good);border-color:var(--good);color:#fff;}
button.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;}
.feedback{min-height:24px;margin-top:8px;font-weight:600;}
.next{display:none;margin-top:10px;padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;}
.done{text-align:center;padding:16px;}
.restart{margin-top:10px;padding:10px 20px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer;}
.dims{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;}
.dims label{font-size:.85rem;font-weight:700;flex:1;min-width:80px;}
.dims input{width:100%;padding:8px;border-radius:8px;border:2px solid #d1d5db;}
.inputRow{display:flex;gap:10px;margin-top:8px;align-items:center;}
input[type=number].ans{flex:1;padding:10px;border-radius:10px;border:2px solid #d1d5db;}
button.submit{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
<h1>📦 3D Builder & Explorer</h1>
<div class="sub">Drag to spin the shape · count faces, edges, vertices · compute surface area & volume</div>
<div class="tabs">
  <button class="tab active" id="tabExplore">Explore & Count</button>
  <button class="tab" id="tabCalc">Build & Calculate</button>
</div>
<div class="card">
  <canvas id="stage"></canvas>
  <div id="below"></div>
</div>
</div>
<script>

// ---------- animated 3D background ----------
(function(){
  const canvas=document.getElementById('bgCanvas');
  if(!canvas || typeof THREE==='undefined') return;
  const bgRenderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  bgRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  bgRenderer.setSize(window.innerWidth,window.innerHeight);
  const bgScene=new THREE.Scene();
  const bgCam=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,100);
  bgCam.position.set(0,0,9);
  const bl=new THREE.DirectionalLight(0xffffff,1.1); bl.position.set(5,6,7); bgScene.add(bl);
  bgScene.add(new THREE.AmbientLight(0xffffff,0.55));
  const colors=[0xea5e9,0x38bdf8];
  const geos=[
    new THREE.IcosahedronGeometry(1,0),
    new THREE.TorusGeometry(0.7,0.24,10,26),
    new THREE.OctahedronGeometry(1,0),
    new THREE.TetrahedronGeometry(1.05,0),
    new THREE.TorusKnotGeometry(0.55,0.16,64,8)
  ];
  const shapes=[];
  const count = window.innerWidth<520? 7 : 12;
  for(let i=0;i<count;i++){
    const geo=geos[i%geos.length];
    const wire=i%2===0;
    const mat=new THREE.MeshStandardMaterial({color:colors[i%colors.length],wireframe:wire,transparent:true,opacity:wire?0.35:0.16,roughness:0.55,metalness:0.1});
    const mesh=new THREE.Mesh(geo,mat);
    const scl=0.5+Math.random()*0.9;
    mesh.scale.set(scl,scl,scl);
    mesh.position.set((Math.random()-0.5)*16,(Math.random()-0.5)*16,(Math.random()-0.5)*10-3);
    mesh.rotation.set(Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2);
    mesh.userData.rot={x:(Math.random()-0.5)*0.006,y:(Math.random()-0.5)*0.007};
    mesh.userData.driftY=(Math.random()*0.006+0.002)*(Math.random()<0.5?1:-1);
    bgScene.add(mesh); shapes.push(mesh);
  }
  function resizeBg(){ bgRenderer.setSize(window.innerWidth,window.innerHeight); bgCam.aspect=window.innerWidth/window.innerHeight; bgCam.updateProjectionMatrix(); }
  window.addEventListener('resize',resizeBg);
  function animateBg(){
    requestAnimationFrame(animateBg);
    shapes.forEach(s=>{
      s.rotation.x+=s.userData.rot.x; s.rotation.y+=s.userData.rot.y;
      s.position.y+=s.userData.driftY;
      if(s.position.y>9) s.position.y=-9; if(s.position.y<-9) s.position.y=9;
    });
    bgCam.position.x = Math.sin(Date.now()*0.00007)*1.5;
    bgCam.lookAt(0,0,0);
    bgRenderer.render(bgScene,bgCam);
  }
  animateBg();
})();
let renderer, scene, camera, mesh, rotX=0.4, rotY=0.6, dragging=false, lastX=0, lastY=0;
function initThree(){
  const canvas=document.getElementById('stage');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  camera.position.set(0,0,5);
  const light=new THREE.DirectionalLight(0xffffff,1); light.position.set(3,4,5); scene.add(light);
  scene.add(new THREE.AmbientLight(0x99aabb,0.9));
  resize();
  window.addEventListener('resize',resize);
  canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.style.cursor='grabbing';});
  window.addEventListener('pointerup',()=>{dragging=false;canvas.style.cursor='grab';});
  window.addEventListener('pointermove',e=>{
    if(!dragging)return;
    rotY += (e.clientX-lastX)*0.01; rotX += (e.clientY-lastY)*0.01;
    lastX=e.clientX; lastY=e.clientY;
  });
  animate();
}
function resize(){
  const canvas=document.getElementById('stage');
  const w=canvas.clientWidth||400, h=220;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
function animate(){
  requestAnimationFrame(animate);
  if(mesh){ mesh.rotation.x=rotX; mesh.rotation.y=rotY; if(!dragging){ rotY+=0.003; } }
  renderer.render(scene,camera);
}
function setMesh(geo,color){
  if(mesh){ scene.remove(mesh); mesh.geometry.dispose(); }
  const mat=new THREE.MeshStandardMaterial({color:color||0x0ea5e9,metalness:0.1,roughness:0.6});
  mesh=new THREE.Mesh(geo,mat);
  scene.add(mesh);
}

// ---- Explore & Count ----
const shapes=[
  {name:'Cube',f:6,e:12,v:8,geo:()=>new THREE.BoxGeometry(1.6,1.6,1.6)},
  {name:'Cuboid',f:6,e:12,v:8,geo:()=>new THREE.BoxGeometry(2,1.1,1.4)},
  {name:'Sphere',f:1,e:0,v:0,geo:()=>new THREE.SphereGeometry(1,32,24)},
  {name:'Cylinder',f:3,e:2,v:0,geo:()=>new THREE.CylinderGeometry(0.9,0.9,1.8,32)},
  {name:'Cone',f:2,e:1,v:1,geo:()=>new THREE.ConeGeometry(1,1.9,32)}
];
let si=0, exScore=0, exOrder=[], exIdx=0, exAsked=[];
function buildExploreQuiz(){
  exOrder=[];
  shapes.forEach(s=>{ exOrder.push({shape:s,prop:'f'}); exOrder.push({shape:s,prop:'e'}); exOrder.push({shape:s,prop:'v'}); });
  exOrder=exOrder.sort(()=>Math.random()-0.5).slice(0,8);
}
function startExplore(){ exScore=0; exIdx=0; buildExploreQuiz(); renderExplore(); }
function renderExplore(){
  const below=document.getElementById('below');
  if(exIdx>=exOrder.length){
    below.innerHTML=`<div class="done"><h2>🏁 Done!</h2><p>Score: <b>${exScore} / ${exOrder.length}</b></p>
    <p style="color:var(--muted);font-size:.9rem;">Covers: identifying cube, cuboid, sphere, cylinder, cone by faces, edges and vertices.</p>
    <button class="restart" onclick="startExplore()">Play Again</button></div>`;
    return;
  }
  const item=exOrder[exIdx];
  setMesh(item.shape.geo());
  const propName={f:'faces',e:'edges',v:'vertices'}[item.prop];
  below.innerHTML=`<div class="stats"><span>Question ${exIdx+1} of ${exOrder.length}</span><span>Score: ${exScore}</span></div>
  <div class="shapename">${item.shape.name}</div>
  <div class="q">How many ${propName} does a ${item.shape.name.toLowerCase()} have?</div>
  <div class="opts" id="opts"></div><div class="feedback" id="fb"></div>
  <button class="next" id="nextEx">Next ▶</button>`;
  const correct=item.shape[item.prop];
  const set=new Set([correct]);
  while(set.size<4){ set.add(Math.max(0,correct+(Math.floor(Math.random()*5)-2))); }
  const opts=Array.from(set).sort(()=>Math.random()-0.5);
  const optsEl=document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      if(o===correct){ b.classList.add('correct'); exScore++; document.getElementById('fb').textContent='✅ Correct!'; document.getElementById('fb').style.color='var(--good)'; }
      else{ b.classList.add('wrong'); document.querySelectorAll('.opt').forEach(x=>{ if(parseInt(x.textContent)===correct) x.classList.add('correct'); });
        document.getElementById('fb').textContent=`❌ Correct: ${correct}`; document.getElementById('fb').style.color='var(--bad)'; }
      document.getElementById('nextEx').style.display='inline-block';
    };
    optsEl.appendChild(b);
  });
}
document.addEventListener('click',e=>{ if(e.target && e.target.id==='nextEx'){ exIdx++; renderExplore(); }});

// ---- Build & Calculate ----
let L=2,W=3,H=4, calcStage=0, calcScore=0;
function renderCalc(){
  setMesh(new THREE.BoxGeometry(L/2,H/2,W/2));
  const below=document.getElementById('below');
  const SA=2*(L*W+W*H+H*L), V=L*W*H;
  below.innerHTML=`<div class="stats"><span>Build & Calculate</span><span>Score: ${calcScore}</span></div>
  <div class="dims">
    <label>Length (l)<input type="number" id="dimL" value="${L}" min="1" max="10"></label>
    <label>Width (w)<input type="number" id="dimW" value="${W}" min="1" max="10"></label>
    <label>Height (h)<input type="number" id="dimH" value="${H}" min="1" max="10"></label>
  </div>
  <div class="q">A cuboid has length ${L}, width ${W}, height ${H} (all in cm). What is its <b>${calcStage===0?'Volume':'Surface Area'}</b>?</div>
  <div class="inputRow"><input type="number" class="ans" id="calcAns" placeholder="${calcStage===0?'Volume in cm³':'Surface area in cm²'}"><button class="submit" id="calcSubmit">Check</button></div>
  <div class="feedback" id="fbCalc"></div>`;
  ['dimL','dimW','dimH'].forEach((id,i)=>{
    document.getElementById(id).oninput=(e)=>{
      const val=Math.max(1,Math.min(10,parseInt(e.target.value)||1));
      if(i===0)L=val; if(i===1)W=val; if(i===2)H=val;
      renderCalc();
    };
  });
  document.getElementById('calcSubmit').onclick=()=>{
    const val=parseFloat(document.getElementById('calcAns').value);
    const correct = calcStage===0? V : SA;
    const fb=document.getElementById('fbCalc');
    if(isNaN(val)){ fb.textContent='Enter a number!'; fb.style.color='var(--bad)'; return; }
    document.getElementById('calcSubmit').disabled=true;
    if(Math.abs(val-correct)<0.5){ calcScore++; fb.textContent=`✅ Correct — ${correct} ${calcStage===0?'cm³':'cm²'}!`; fb.style.color='var(--good)'; }
    else{ fb.textContent=`❌ Correct answer: ${correct} ${calcStage===0?'cm³':'cm²'} (Volume = l×w×h, Surface Area = 2(lw+wh+hl))`; fb.style.color='var(--bad)'; }
    setTimeout(()=>{ calcStage = calcStage===0?1:0; if(calcStage===0){ L=r(2,8);W=r(2,8);H=r(2,8);} renderCalc(); },1600);
  };
}
function r(a,b){return Math.floor(a+Math.random()*(b-a+1));}

function switchMode(m){
  document.getElementById('tabExplore').classList.toggle('active',m==='explore');
  document.getElementById('tabCalc').classList.toggle('active',m==='calc');
  if(m==='explore') startExplore(); else { calcStage=0; calcScore=0; L=2;W=3;H=4; renderCalc(); }
}
document.getElementById('tabExplore').onclick=()=>switchMode('explore');
document.getElementById('tabCalc').onclick=()=>switchMode('calc');
initThree();
startExplore();
</script>
</body>
</html>
